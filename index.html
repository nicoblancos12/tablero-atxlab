<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de proyectos · atxlab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --morado:#7C3AED; --vivo:#7C3AED; --lavanda:#A78BFA; --tinte:#F1ECFE;
    --cuerpo:#4B4B55; --tenue:#84838C; --linea:#E4E3E8;
    --verde:#16A34A; --ambar:#B45309; --rojo:#DC2626;

    --fondo:#F7F7F9; --sidebar:#FFFFFF; --texto:#17171C; --texto-fuerte:#0E0E12; --panel:#fff; --panel2:#F1F0F4;
    --panel-hi:#FAFAFC; --linea-suave:#EDEDF1;
    --sombra:0 1px 2px rgba(20,15,35,.04);
    --tinte-rojo:#FEF2F2; --tinte-ambar-suave:#FFFBEB; --tinte-ambar-fuerte:#FEF3C7;
    --tinte-rojo-fuerte:#FEE2E2; --borde-rojo:#FECACA;
    --verde-txt:#15803D; --ambar-txt:#9A6100; --rojo-txt:#B91C1C;
    --rojo-borde-suave:#FCA5A5; --rojo-fondo-suave:#FEF2F2;
    --ambar-borde-suave:#FDE68A; --ambar-fondo-suave:#FFFBEB;
    --tinte-verde:#F0FDF4; --verde-borde-suave:#BBF7D0;
    --barra-glow:none; --marcador:rgba(14,14,18,.4);
    --card-borde-w:1px; --card-borde:var(--linea); --card-borde-reposo:rgba(124,58,237,.28);
    --card-sombra:0 1px 2px rgba(20,15,35,.03),0 8px 20px -14px rgba(20,15,35,.15);
    --violet-dim:rgba(124,58,237,.08);
  }
  [data-theme="oscuro"]{
    --morado:#8B5CF6; --vivo:#A78BFA; --lavanda:#8B5CF6; --tinte:#1E1A2E;
    --cuerpo:#9A9AA4; --tenue:#606068; --linea:#2A2A32;
    --verde:#4ADE80; --ambar:#FBBF24; --rojo:#F87171;
    --card-borde-w:1px; --card-borde:var(--linea); --card-borde-reposo:rgba(139,92,246,.45);
    --card-sombra:0 1px 0 rgba(255,255,255,.02) inset,0 14px 30px -20px rgba(0,0,0,.8);

    --fondo:#0F0F13; --sidebar:#0C0C10; --texto:#F2F2F5; --texto-fuerte:#FFFFFF; --panel:#17171C; --panel2:#1C1C22;
    --panel-hi:#1C1C22; --linea-suave:#212127;
    --sombra:0 1px 0 rgba(255,255,255,.02) inset,0 14px 30px -20px rgba(0,0,0,.8);
    --tinte-rojo:rgba(248,113,113,.1); --tinte-ambar-suave:rgba(251,191,36,.08);
    --tinte-ambar-fuerte:rgba(251,191,36,.16); --tinte-rojo-fuerte:rgba(248,113,113,.18);
    --borde-rojo:rgba(248,113,113,.3);
    --verde-txt:var(--verde); --ambar-txt:var(--ambar); --rojo-txt:var(--rojo);
    --rojo-borde-suave:rgba(248,113,113,.3); --rojo-fondo-suave:rgba(248,113,113,.08);
    --ambar-borde-suave:rgba(251,191,36,.3); --ambar-fondo-suave:rgba(251,191,36,.08);
    --tinte-verde:rgba(74,222,128,.1); --verde-borde-suave:rgba(74,222,128,.28);
    --barra-glow:0 0 10px rgba(139,92,246,.5); --marcador:rgba(255,255,255,.45);
    --violet-dim:rgba(139,92,246,.14);
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  html[data-theme="oscuro"]{color-scheme:dark}
  body{margin:0;background:var(--fondo);color:var(--texto);
       font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;
       -webkit-font-smoothing:antialiased;
       transition:background .2s,color .2s}

  .layout{display:flex;min-height:100vh}

  /* ── sidebar ──────────────────────────────────────────────────────── */
  #sidebar{width:216px;flex:none;background:var(--sidebar);border-right:1px solid var(--linea-suave);
          display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .side-brand{display:flex;align-items:center;gap:10px;padding:4px 6px 20px}
  .side-mark{width:32px;height:32px;border-radius:9px;background:var(--vivo);flex:none;color:#fff;
            display:inline-flex;align-items:center;justify-content:center;font-size:15px;
            box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 16px -3px rgba(124,58,237,.7)}
  .side-brand b{font-size:15px;font-weight:800;display:block;letter-spacing:-.01em;color:var(--texto-fuerte)}
  .side-brand span{font-size:10px;color:var(--tenue);letter-spacing:.09em;text-transform:uppercase}

  .grp-label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
            color:var(--tenue);padding:14px 10px 6px}
  .grp-label:first-child{padding-top:0}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
           color:var(--cuerpo);font-size:13px;font-weight:500;cursor:pointer;position:relative;
           background:none;border:0;width:100%;text-align:left;font-family:inherit}
  .nav-item:hover{background:var(--panel2);color:var(--texto-fuerte)}
  .nav-item.on{background:var(--violet-dim);color:var(--texto-fuerte);
              box-shadow:0 0 0 1px rgba(124,58,237,.3) inset}
  .nav-item .ic{width:15px;text-align:center;font-size:13px;flex:none}
  .nav-item .count{margin-left:auto;font-size:10.5px;color:var(--tenue);font-variant-numeric:tabular-nums}
  .nav-item.on .count{color:var(--vivo)}

  /* ── header del contenido ─────────────────────────────────────────── */
  .content{flex:1;min-width:0;
    background-image:radial-gradient(circle, var(--linea-suave) 1px, transparent 1px);
    background-size:22px 22px}
  header{background:color-mix(in srgb, var(--fondo) 75%, transparent);color:var(--texto);padding:14px 28px;
         display:flex;align-items:center;justify-content:space-between;gap:20px;
         border-bottom:1px solid var(--linea-suave);
         backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
  .search{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--linea);
         border-radius:9px;padding:8px 12px;width:320px;color:var(--tenue);font-size:12.5px}
  .search input{border:0;background:none;outline:0;color:var(--texto);font-size:12.5px;
                font-family:inherit;flex:1;min-width:0}
  .search input::placeholder{color:var(--tenue)}
  .search kbd{font-size:10px;background:var(--panel2);border:1px solid var(--linea);
             border-radius:5px;padding:2px 6px;color:var(--tenue)}
  header .der{display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--cuerpo)}
  header .tema-btn{width:32px;height:32px;padding:0;border-radius:9px;background:var(--panel);
                   border:1px solid var(--linea);color:var(--texto);
                   display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
  header .tema-btn:hover{border-color:var(--vivo)}
  header .avatar{width:32px;height:32px;border-radius:9px;flex:none;background:var(--vivo);color:#fff;
                 display:inline-flex;align-items:center;justify-content:center;
                 font-size:12px;font-weight:700;letter-spacing:.02em}
  main{max-width:1180px;margin:0 auto;padding:26px 28px 70px;position:relative}

  .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:24px}
  h1{font-size:34px;margin:6px 0 0;color:var(--texto-fuerte);font-weight:800;letter-spacing:-.025em}
  h1 .sub{font-size:15px;color:var(--tenue);font-weight:400;margin-left:8px}
  .link{background:none;border:0;color:var(--vivo);cursor:pointer;padding:0;font-size:13px}
  .acciones{display:flex;gap:10px}
  .btn{background:var(--vivo);color:#fff;border:0;border-radius:10px;
       padding:11px 20px;cursor:pointer;font-size:14px;font-weight:700;
       box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 22px -8px rgba(124,58,237,.65);
       transition:background .15s,box-shadow .15s}
  .btn:hover{background:var(--lavanda);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 10px 26px -8px rgba(124,58,237,.8)}
  .btn.ghost{background:var(--panel);color:var(--vivo);border:1px solid var(--linea);
            box-shadow:none;padding:10px 19px}
  .btn.ghost:hover{background:var(--panel);box-shadow:none;border-color:var(--vivo)}
  .btn.full{width:100%;margin-top:12px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{background:var(--panel);border:1.5px solid var(--card-borde-reposo);border-radius:14px;
        padding:22px 24px 20px;margin-bottom:16px;box-shadow:var(--card-sombra)}
  .card.proj{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}
  .card.proj:hover{border-color:var(--vivo);background:var(--panel-hi);transform:translateY(-2px);
                   box-shadow:0 0 0 1px rgba(124,58,237,.3),0 0 28px -6px rgba(124,58,237,.55),0 14px 30px -18px rgba(124,58,237,.5)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
  .kpi{background:var(--panel);border:1.5px solid var(--card-borde-reposo);border-radius:12px;padding:16px 18px;
      transition:border-color .15s,box-shadow .15s}
  .kpi.on{border-color:var(--vivo);box-shadow:0 0 0 1px rgba(124,58,237,.2),0 0 20px -8px rgba(124,58,237,.5)}
  .kpi-etq{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
  .kpi-val{font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .kpi-val.verde{color:var(--verde-txt)}
  .kpi-val.rojo{color:var(--rojo-txt)}
  .kpi-val.violet{color:var(--vivo)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .cliente{font-size:11px;color:var(--tenue);text-transform:uppercase;letter-spacing:.16em;font-weight:700}
  .card h3{margin:6px 0 0;font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--texto-fuerte)}
  .pct{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--vivo);margin:20px 0 0;
      display:flex;align-items:baseline}
  .pct span{font-size:13px;font-weight:500;color:var(--tenue);margin-left:8px}
  .pct span.plan{margin-left:auto}
  .pct.grande{font-size:52px;margin:0}
  .cap{font-size:13px;color:var(--cuerpo)}

  .barra{position:relative;height:10px;background:var(--tinte);
         border-radius:999px;overflow:visible}
  .barra-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#A97BEE,#7C3AED);
             box-shadow:var(--barra-glow)}
  .barra-plan{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--marcador)}
  .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--tenue);margin-top:10px}
  .meta .alerta{color:var(--rojo);font-weight:600}
  .meta .ok{color:var(--verde)}

  .semana-linea{margin-top:9px;font-size:12px;color:var(--tenue);font-weight:500}
  .card-meta{margin-top:18px;padding-top:14px;border-top:1px solid var(--linea);
            display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--verde-txt)}
  .card-meta i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .card-meta.alerta,.card-meta.rojo{color:var(--rojo-txt)}
  .card-meta:not(.ok):not(.alerta):not(.rojo){color:var(--ambar-txt)}

  .chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 12px;
        font-size:12px;font-weight:700;border:1px solid;
        white-space:nowrap;flex:none}
  .chip i{flex:none}
  .chip i{width:7px;height:7px;border-radius:50%;display:block}
  .chip-verde{background:var(--tinte-verde);border-color:var(--verde-borde-suave);color:var(--verde-txt)}.chip-verde i{background:var(--verde-txt)}
  .chip-ambar{background:var(--tinte-ambar-fuerte);border-color:var(--ambar-borde-suave);color:var(--ambar-txt)}.chip-ambar i{background:var(--ambar-txt)}
  .chip-rojo{background:var(--tinte-rojo-fuerte);border-color:var(--rojo-borde-suave);color:var(--rojo-txt)}.chip-rojo i{background:var(--rojo-txt)}

  .resumen{display:flex;gap:32px;align-items:center}
  .res-izq{min-width:150px}
  .res-der{flex:1}
  .res-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .delta{font-size:13px;color:var(--cuerpo)}

  .tabs{display:flex;gap:6px;margin:22px 0 14px}
  .tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;
       cursor:pointer;font-size:14px;color:var(--tenue)}
  .tab.on{color:var(--morado);border-color:var(--vivo);font-weight:600}

  .frente{margin:18px 0 8px;font-size:14px;color:var(--morado)}
  .frente:first-child{margin-top:0}
  .act,.req{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--linea)}
  .act.detenida{background:var(--tinte-ambar-suave);margin:0 -8px;padding-left:12px;padding-right:12px;border-radius:8px}
  .req.ok{opacity:.55}
  .req.mal{background:var(--tinte-rojo);margin:0 -8px;padding-left:12px;padding-right:12px;border-radius:8px}
  .act-cuerpo{flex:1;min-width:0}
  .act-tit{font-size:14.5px;color:var(--texto-fuerte)}
  .act-meta{font-size:12.5px;color:var(--tenue);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .badge-stop{background:var(--ambar);color:#fff;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600}
  .bloquea{font-size:12px;color:var(--cuerpo);margin-top:5px}
  .bloquea .frenando{color:var(--rojo);font-weight:600}

  .palomear{width:46px;height:30px;border-radius:8px;border:1.5px solid var(--lavanda);
            background:var(--panel);color:var(--vivo);cursor:pointer;font-size:12px;font-weight:700;flex:none}
  .palomear.on{background:var(--verde);border-color:var(--verde);color:#fff;font-size:15px}
  .coment,.borrar{background:none;border:0;cursor:pointer;color:var(--tenue);font-size:14px;padding:4px 6px}
  .borrar{font-size:19px;line-height:1}
  .coment:hover,.borrar:hover{color:var(--vivo)}

  textarea{width:100%;min-height:70px;border:1px solid var(--linea);border-radius:10px;
           padding:11px;font-family:inherit;font-size:14px;resize:vertical;margin-bottom:10px}
  .com{border-bottom:1px solid var(--linea);padding:12px 0}
  .com-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tenue)}
  .com p{margin:5px 0 0;font-size:14px;color:var(--texto-fuerte)}
  .nota{background:var(--tinte);border:1px solid var(--card-borde-reposo);border-radius:8px;
        padding:12px 15px;font-size:14px;line-height:1.5;
        color:var(--texto);margin:0 0 16px}
  .vacio{color:var(--tenue);font-size:14px;text-align:center;padding:24px 0;margin:0}

  #gate{position:fixed;inset:0;background:var(--morado);display:none;
        align-items:center;justify-content:center;z-index:50;padding:24px}
  .gate-caja{background:var(--panel);border-radius:16px;padding:40px;max-width:460px;text-align:center}
  .gate-caja h2{color:var(--morado);margin:0 0 12px;font-size:22px}
  .gate-caja p{color:var(--cuerpo);font-size:14px;line-height:1.5}
  .gate-caja .detalle{font-size:11.5px;color:var(--tenue);word-break:break-all}

  #aviso{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);
         background:var(--morado);color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;
         transition:.25s;opacity:0;z-index:60}
  #aviso.on{transform:translateX(-50%) translateY(0);opacity:1}

  /* ── formularios y modal ─────────────────────────────────────────── */
  #modal{position:fixed;inset:0;background:rgba(30,10,50,.55);display:none;
         align-items:flex-start;justify-content:center;z-index:55;padding:40px 20px;overflow:auto}
  .modal-caja{background:var(--panel);border:1.5px solid var(--card-borde-reposo);border-radius:16px;
             width:100%;max-width:620px;padding:28px 30px;box-shadow:var(--card-sombra)}
  .modal-caja h2{margin:0 0 16px;color:var(--vivo);font-size:23px;font-weight:800}
  .modal-cuerpo{max-height:62vh;overflow:auto;padding-right:4px}
  .modal-pie{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;
             border-top:1px solid var(--linea);padding-top:16px}
  .campo{display:block;margin-bottom:16px}
  .campo>span{display:block;font-size:14px;color:var(--texto);margin-bottom:6px;font-weight:700}
  .campo input[type=text],.campo input:not([type]),.campo input[type=number],
  .campo input[type=date],.campo select,.campo textarea{
    width:100%;border:1px solid var(--linea);border-radius:8px;padding:10px 12px;
    font-family:inherit;font-size:15px;background:var(--panel2);color:var(--texto)}
  .campo input::placeholder,.campo textarea::placeholder{color:var(--tenue)}
  .campo select option{background:var(--panel);color:var(--texto)}
  .campo textarea{min-height:62px;resize:vertical;margin:0}
  .campo input[type=file]{font-size:14px;color:var(--texto)}
  .ayuda{display:inline-block;margin-top:6px;font-size:13.5px;color:var(--vivo);font-weight:500}
  .checks{max-height:190px;overflow:auto;border:1px solid var(--linea);border-radius:8px;padding:8px 10px}
  .checks label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:5px 0;cursor:pointer}
  .checks label i{color:var(--tenue);font-style:normal;font-size:12px;margin-left:auto;white-space:nowrap}
  .ok-caja{background:var(--tinte-verde);border:1px solid var(--verde-borde-suave);border-radius:8px;padding:10px 13px;
           font-size:13.5px;color:var(--verde-txt);margin:0 0 16px}
  .mal-caja{background:var(--tinte-rojo);border:1px solid var(--borde-rojo);border-radius:8px;padding:10px 13px;
            font-size:13.5px;color:var(--rojo-txt);margin:0 0 16px}

  /* ── pantalla de confirmación del plan ───────────────────────────── */
  .resumen-alta{display:flex;gap:26px;flex-wrap:wrap;font-size:14px;color:var(--cuerpo);
                background:var(--tinte);border-radius:10px;padding:13px 16px;margin-bottom:14px}
  .resumen-alta b{color:var(--morado)}
  .tabla-scroll{max-height:56vh;overflow:auto;border:1px solid var(--linea);border-radius:10px}
  .tabla{width:100%;border-collapse:collapse;font-size:13px}
  .tabla th{position:sticky;top:0;background:var(--panel);text-align:left;padding:10px;
            border-bottom:1px solid var(--linea);color:var(--tenue);font-weight:600;z-index:1}
  .tabla td{padding:9px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
  .tabla tr.t-requisito{background:var(--tinte-ambar-suave)}
  .tabla tr.t-hito{background:var(--tinte)}
  .tabla tr.t-ignorar{opacity:.45}
  .tabla .wbs{color:var(--tenue);white-space:nowrap}
  .tabla .num{text-align:right;white-space:nowrap;color:var(--cuerpo)}
  .tabla .nowrap{white-space:nowrap;color:var(--cuerpo)}
  .tabla select{border:1px solid var(--linea);border-radius:6px;padding:5px 7px;font-size:12.5px;font-family:inherit}
  .mini{font-size:11.5px;color:var(--cuerpo);margin-top:4px}
  .mini.suelto,.bloquea.suelto{color:var(--tenue);font-style:italic}

  /* ── detalles de proyecto ────────────────────────────────────────── */
  .frente-bloque{margin-bottom:22px}
  .frente{display:flex;justify-content:space-between;align-items:baseline;
          margin:0 0 6px;font-size:14.5px;color:var(--morado)}
  .frente-av{font-size:12.5px;color:var(--tenue);font-weight:400}
  .act-meta span.tarde{color:var(--rojo);font-weight:600}
  .editar{background:none;border:0;cursor:pointer;color:var(--tenue);padding:4px 6px}

  /* ── riesgos y dueño ─────────────────────────────────────────────── */
  .act.riesgo{background:var(--tinte-rojo);margin:0 -8px;padding-left:12px;padding-right:12px;
              border-radius:8px;border-left:3px solid var(--rojo)}
  .badge-riesgo{background:var(--rojo);color:#fff;border-radius:4px;padding:1px 7px;
                font-size:11px;font-weight:600;margin-left:8px;white-space:nowrap}
  .riesgo-txt{font-size:12.5px;color:var(--rojo-txt);margin-top:6px}
  .riesgo-txt i{color:var(--tenue);font-style:normal}
  .act-meta .dueno{cursor:pointer;border-radius:4px;padding:1px 5px;margin-left:-5px}
  .act-meta .dueno:hover{background:var(--tinte);color:var(--vivo)}
  .act-meta .dueno.sin{color:var(--vivo);font-weight:600}
  .com.con-riesgo{background:var(--tinte-rojo);border-radius:8px;padding:12px;margin:8px 0;border:1px solid var(--borde-rojo)}
  .check-riesgo{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--cuerpo);margin:0 0 12px}

  /* ── fechas de cierre bajo la barra ──────────────────────────────── */
  .cierres{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
           margin-top:9px;font-size:12.5px;color:var(--tenue)}
  .cierres b{color:var(--morado)}
  .cierre-est i{font-style:normal}
  .cierre-est.ok b,.cierre-est.ok i{color:var(--verde-txt)}
  .cierre-est.alerta b,.cierre-est.alerta i{color:var(--ambar-txt)}
  .cierre-est.mal b,.cierre-est.mal i{color:var(--rojo)}
  .cierre-est.sin{font-style:italic}

  /* ── panel de atención en la portada ─────────────────────────────── */
  .panel-atencion{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
                  gap:16px;margin-bottom:22px}
  .pa-col{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:16px 18px}
  .pa-col h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;
             color:var(--tenue);display:flex;align-items:center;gap:8px}
  .pa-col h4.mal{color:var(--rojo)}
  .pa-col h4.alerta{color:var(--ambar-txt)}
  .pa-n{background:var(--tinte);border-radius:10px;padding:1px 8px;font-size:12px;letter-spacing:0}
  .pa-col h4.mal .pa-n{background:var(--tinte-rojo-fuerte)}
  .pa-col h4.alerta .pa-n{background:var(--tinte-ambar-fuerte)}
  .pa-item{padding:8px 0;border-bottom:1px solid var(--linea);cursor:pointer}
  .pa-item:last-child{border-bottom:0}
  .pa-item:hover .pa-tit,.pa-item:hover .pa-txt{color:var(--vivo)}
  .pa-tit{font-size:13.5px;color:var(--texto-fuerte);font-weight:600}
  .pa-txt{font-size:13px;color:var(--cuerpo);margin-top:2px}
  .pa-pie{font-size:11.5px;color:var(--tenue);margin-top:3px}
  .pa-item.mal-item .pa-pie{color:var(--rojo);font-weight:600}
  .pa-item.alerta-item .pa-pie{color:var(--ambar-txt)}
  .pa-vacio{font-size:13px;color:var(--tenue);margin:6px 0}

  /* ── selector de dueño ───────────────────────────────────────────── */
  .lista-personas{border:1px solid var(--linea);border-radius:10px;overflow:hidden;margin-top:10px}
  .opcion-persona{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;
                  border-bottom:1px solid var(--linea)}
  .opcion-persona:last-child{border-bottom:0}
  .opcion-persona:hover{background:var(--tinte)}
  .op-nombre{font-size:14.5px;color:var(--texto-fuerte)}
  .op-rol{font-size:12.5px;color:var(--tenue);margin-left:auto}
  .op-vacio{color:var(--tenue);font-style:italic}

  /* ── fechas de cierre (versión con las dos fechas) ───────────────── */
  .cierres{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:12px}
  .cierre{display:flex;flex-direction:column;font-size:11.5px;color:var(--tenue);
          text-transform:uppercase;letter-spacing:.6px}
  .cierre b{font-size:15px;color:var(--morado);text-transform:none;letter-spacing:0;margin-top:2px}
  .cierre i{font-size:12px;font-style:normal;text-transform:none;letter-spacing:0;margin-top:1px}
  .cierre.estimada{text-align:right}
  .cierre.estimada.ok b,.cierre.estimada.ok i{color:var(--verde-txt)}
  .cierre.estimada.alerta b,.cierre.estimada.alerta i{color:var(--ambar-txt)}
  .cierre.estimada.mal b,.cierre.estimada.mal i{color:var(--rojo)}
  .cierre.sin{text-align:right}
  .cierre.sin b{font-size:13px;color:var(--tenue);font-style:italic;font-weight:400}

  /* el panel ahora vive dentro del proyecto */
  .panel-atencion{margin:18px 0 4px}

  /* ── pop-up del semáforo ─────────────────────────────────────────── */
  .sem-wrap{position:relative;display:inline-flex;outline:none}
  .sem-wrap .chip{cursor:help;border-style:dashed}
  .sem-pop{display:none;position:absolute;top:calc(100% + 10px);left:0;width:390px;
           background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;
           box-shadow:0 12px 32px rgba(74,16,128,.16);z-index:40;cursor:default}
  .sem-wrap:hover .sem-pop,.sem-wrap:focus .sem-pop,.sem-wrap:focus-within .sem-pop{display:block}
  .sem-pop::before{content:'';position:absolute;top:-7px;left:26px;width:12px;height:12px;
                   background:var(--panel);border-left:1px solid var(--linea);border-top:1px solid var(--linea);
                   transform:rotate(45deg)}
  .sem-pop h5{margin:0 0 9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tenue)}
  .sem-pop h5.sep{margin-top:16px;padding-top:14px;border-top:1px solid var(--linea)}
  .sem-razones{margin:0;padding:0;list-style:none}
  .sem-razones li{font-size:13px;color:var(--cuerpo);line-height:1.45;padding:5px 0 5px 15px;position:relative}
  .sem-razones li::before{content:'';position:absolute;left:0;top:11px;width:7px;height:7px;border-radius:50%}
  .sem-razones li.r-verde::before{background:var(--verde)}
  .sem-razones li.r-ambar::before{background:var(--ambar)}
  .sem-razones li.r-rojo::before{background:var(--rojo)}
  .sem-razones b{color:var(--morado)}
  .sem-regla{display:flex;gap:11px;align-items:flex-start;padding:6px 0;opacity:.5}
  .sem-regla.actual{opacity:1}
  .sem-regla .chip{margin-top:1px}
  .sem-desc{font-size:12.5px;color:var(--cuerpo);line-height:1.4}

  /* ── tira de razones del estatus ─────────────────────────────────── */
  .razones{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
           margin-top:14px;padding-top:13px;border-top:1px solid var(--linea)}
  .razones-etq{font-size:11px;text-transform:uppercase;letter-spacing:.7px;
               color:var(--tenue);margin-right:3px}
  .razon{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
         color:var(--cuerpo);background:var(--panel2);border:1px solid var(--linea);
         border-radius:20px;padding:4px 12px 4px 10px;white-space:nowrap}
  .razon i{width:7px;height:7px;border-radius:50%;flex:none}
  .razon.r-verde i{background:var(--verde)}
  .razon.r-ambar i{background:var(--ambar)}
  .razon.r-rojo i{background:var(--rojo)}
  .razon.r-rojo{color:var(--rojo-txt);border-color:var(--rojo-borde-suave);background:var(--rojo-fondo-suave)}
  .razon.r-ambar{color:var(--ambar-txt);border-color:var(--ambar-borde-suave);background:var(--ambar-fondo-suave)}

  /* el pop-up ahora solo lleva la leyenda: más angosto */
  .sem-pop{width:340px}

  /* ── filtros de actividades ──────────────────────────────────────── */
  .filtros{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px;padding-bottom:14px;
           border-bottom:1px solid var(--linea)}
  .filtro{display:inline-flex;align-items:center;gap:7px;background:var(--panel);cursor:pointer;
          border:1px solid var(--linea);border-radius:20px;padding:5px 12px;
          font-size:12.5px;font-family:inherit;color:var(--cuerpo)}
  .filtro span{background:var(--tinte);border-radius:10px;padding:0 7px;font-size:11.5px;color:var(--tenue)}
  .filtro:hover{border-color:var(--lavanda)}
  .filtro.on{background:var(--vivo);border-color:var(--vivo);color:#fff;font-weight:600}
  .filtro.on span{background:rgba(255,255,255,.25);color:#fff}

  /* ── actividad atrasada ──────────────────────────────────────────── */
  .act.atrasada{background:var(--tinte-ambar-suave);margin:0 -8px;padding-left:12px;padding-right:12px;
                border-radius:8px;border-left:3px solid var(--ambar)}

  /* ── etiquetas del panel ─────────────────────────────────────────── */
  .pa-tag{border-radius:4px;padding:1px 7px;font-size:10.5px;font-weight:600;
          margin-left:7px;white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
  .pa-tag.detenida{background:var(--tinte-ambar-fuerte);color:var(--ambar-txt)}
  .pa-tag.atrasada{background:var(--tinte-rojo-fuerte);color:var(--rojo-txt)}
  .pa-tit{display:flex;align-items:baseline;gap:2px;flex-wrap:wrap}
  .pa-mas{margin-top:9px;font-size:12.5px}

  /* ── panel de atención: filas anchas en vez de columnas ──────────── */
  .panel-atencion{display:block;margin:18px 0 4px}
  .pa-fila{background:var(--panel);border:1px solid var(--linea);border-radius:14px;
           padding:14px 18px 16px;margin-bottom:12px}
  .pa-cab{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}
  .pa-cab h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.8px;
             color:var(--tenue);display:flex;align-items:center;gap:8px}
  .pa-cab h4.mal{color:var(--rojo)}
  .pa-cab h4.alerta{color:var(--ambar-txt)}
  .pa-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 22px}
  .pa-item{padding:8px 0;border-bottom:0;border-left:2px solid transparent;padding-left:11px;cursor:pointer}
  .pa-item.mal-item{border-left-color:var(--rojo)}
  .pa-item.alerta-item{border-left-color:var(--ambar)}
  .pa-item:hover{background:var(--tinte);border-radius:0 8px 8px 0}

  /* ── resaltado al llegar desde el panel ──────────────────────────── */
  .act.resaltada,.req.resaltada{animation:destello 2.6s ease-out;
    box-shadow:0 0 0 2px var(--lavanda);border-radius:8px}
  @keyframes destello{
    0%{background:#EDE0FB}
    35%{background:#EDE0FB}
    100%{background:transparent}
  }

  /* ── avance de la actividad: el color dice cuánto lleva ──────────── */
  .palomear.av-0{background:var(--panel);border-color:var(--linea);color:var(--tenue)}
  .palomear.av-25{background:var(--tinte);border-color:var(--lavanda);color:var(--vivo)}
  .palomear.av-50{background:var(--violet-dim);border-color:var(--lavanda);color:var(--morado)}
  .palomear.av-75{background:var(--vivo);border-color:var(--vivo);color:#fff}
  .palomear.av-100{background:var(--verde);border-color:var(--verde);color:#fff;font-size:15px}

  /* ── estatus sin datos de plan ───────────────────────────────────── */
  .chip-sin{border-color:var(--tenue);color:var(--tenue);border-style:dashed}
  .chip-sin i{background:var(--tenue)}
  .razon.r-sin{color:var(--tenue);border-color:var(--linea);background:var(--panel2)}
  .razon.r-sin i{background:var(--tenue)}
  .sem-razones li.r-sin::before{background:var(--tenue)}

  /* ── selector múltiple de dueños, en la misma fila ───────────────── */
  .filtros{align-items:center}
  .dueno-wrap{position:relative;display:inline-flex;margin-left:6px}
  .filtro.sel{gap:9px;border-style:dashed}
  .filtro.sel b{font-size:10px;line-height:1;color:var(--tenue)}
  .filtro.sel.on b,.filtro.sel.abierto b{color:#fff}
  .filtro.sel.abierto{background:var(--morado);border-color:var(--morado);color:#fff}
  .menu-duenos{position:absolute;top:calc(100% + 7px);left:0;min-width:250px;z-index:30;
               background:#fff;border:1px solid var(--linea);border-radius:12px;padding:6px;
               box-shadow:0 12px 30px rgba(74,16,128,.16)}
  .op-dueno{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
            padding:8px 10px;border-radius:8px;cursor:pointer;font-family:inherit;
            font-size:13.5px;color:#26123c;text-align:left}
  .op-dueno:hover{background:var(--tinte)}
  .op-dueno i{width:16px;height:16px;border:1.5px solid var(--lavanda);border-radius:4px;
              font-style:normal;font-size:11px;line-height:14px;text-align:center;
              color:#fff;flex:none}
  .op-dueno.on i{background:var(--vivo);border-color:var(--vivo)}
  .op-dueno span{margin-left:auto;font-size:12px;color:var(--tenue)}
  .op-limpiar{width:100%;background:none;border:0;border-top:1px solid var(--linea);
              margin-top:4px;padding:9px 10px 5px;cursor:pointer;font-family:inherit;
              font-size:12.5px;color:var(--vivo);text-align:left}

  /* ── papelera, cierre de proyecto y confeti ──────────────────────── */
  .btn.ghost.peligro{color:var(--rojo);border-color:#F3D2D2}
  .btn.ghost.peligro:hover{background:#FFF5F5}
  .banda-cerrado{background:#F1FBF4;border:1px solid #BFE9CC;color:#166534;
                 border-radius:10px;padding:10px 16px;font-size:13.5px;
                 font-weight:600;margin-bottom:16px}

  .confeti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
  .confeti i{position:absolute;top:-24px;display:block;border-radius:2px;opacity:.95;
             animation-name:caer;animation-timing-function:linear;animation-fill-mode:forwards}
  @keyframes caer{
    0%{transform:translateY(0) rotate(0);opacity:1}
    100%{transform:translateY(105vh) rotate(var(--giro));opacity:.85}
  }
  .confeti-msg{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%) scale(.85);
               background:var(--morado);color:#fff;padding:16px 30px;border-radius:40px;
               font-size:21px;font-weight:700;letter-spacing:-.3px;
               box-shadow:0 14px 40px rgba(74,16,128,.35);
               animation:aparece .5s cubic-bezier(.2,1.5,.4,1) forwards, desvanece .5s 2.6s forwards}
  @keyframes aparece{to{transform:translate(-50%,-50%) scale(1)}}
  @keyframes desvanece{to{opacity:0;transform:translate(-50%,-70%) scale(.95)}}
  @media (prefers-reduced-motion: reduce){
    .confeti i{display:none}
    .confeti-msg{animation:none}
  }
</style>
</head>
<body>

<div class="layout">
  <aside id="sidebar">
    <div class="side-brand">
      <span class="side-mark">◆</span>
      <div><b>AtxLab</b><span>Tablero de proyectos</span></div>
    </div>
    <nav id="sidenav"></nav>
  </aside>

  <div class="content">
    <header>
      <div class="search">
        <span>🔍</span>
        <input id="buscador" type="text" placeholder="Buscar proyectos, clientes..." oninput="buscar(this.value)">
        <kbd>⌘K</kbd>
      </div>
      <div class="der">
        <span id="quien"></span>
        <button class="tema-btn" id="temaBtn" onclick="alternarTema()" title="Cambiar tema"></button>
        <span class="avatar" id="avatar"></span>
      </div>
    </header>
    <main id="app"></main>
  </div>
</div>
<div id="gate"></div>
<div id="modal"></div>
<div id="aviso"></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.20.0/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="plan.js"></script>
<script src="deck.js"></script>
<script src="app.js"></script>
</body>
</html>
